<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 공사일보</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div id="root" class="w-full max-w-md bg-white min-h-screen shadow-lg flex flex-col"></div>

    <script type="text/babel">
        function App() {
            const [workers, setWorkers] = React.useState({
                demolition: 3,
                carpentry: 2,
                electric: 1
            });

            const [selectedTasks, setSelectedTasks] = React.useState({
                livingRoomWood: true,
                bedroomElectric: true,
                balconyTile: false,
                verandaPaint: false
            });

            const [memo, setMemo] = React.useState("거실 자재 입고 지연으로 오후부터 목공 작업 시작함.");

            const updateWorker = (key, delta) => {
                setWorkers(prev => ({
                    ...prev,
                    [key]: Math.max(0, prev[key] + delta)
                }));
            };

            const toggleTask = (key) => {
                setSelectedTasks(prev => ({
                    ...prev,
                    [key]: !prev[key]
                }));
            };

            const handleSubmit = () => {
                alert("공사일보가 성공적으로 제출되었습니다!");
            };

            const handleLoadYesterday = () => {
                alert("전일 데이터(인원 및 공정)를 불러왔습니다.");
            };

            return (
                <div className="flex flex-col h-full min-h-screen justify-between pb-6">
                    {/* Header */}
                    <div>
                        <div className="bg-slate-900 text-white p-4 flex justify-between items-center">
                            <div>
                                <span className="text-xs bg-blue-600 px-2 py-0.5 rounded font-medium">진행중</span>
                                <h1 className="text-lg font-bold mt-1">강남 아파트 인테리어 현장</h1>
                            </div>
                            <button className="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200">
                                현장변경
                            </button>
                        </div>
                        <div className="bg-slate-800 text-slate-300 px-4 py-2.5 text-xs flex justify-between items-center border-t border-slate-700">
                            <span>📅 2026년 08월 25일 (화)</span>
                            <span className="flex items-center gap-1">🌤️ 서울 28°C (자동연동)</span>
                        </div>
                    </div>

                    {/* Content Body */}
                    <div className="p-4 space-y-6 flex-1">
                        {/* Section 1: 투입 인력 */}
                        <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                            <h2 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                                <span className="w-5 h-5 rounded-full bg-blue-100 text-blue-600 inline-flex items-center justify-center text-xs">1</span>
                                투입 인력 및 공종
                            </h2>
                            <div className="space-y-2.5">
                                {Object.entries({ demolition: '철거팀', carpentry: '목공팀', electric: '전기팀' }).map(([key, label]) => (
                                    <div key={key} className="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                                        <span className="text-sm font-medium text-slate-700">{label}</span>
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => updateWorker(key, -1)} className="w-8 h-8 rounded-lg bg-white border border-slate-300 text-slate-600 font-bold flex items-center justify-center active:bg-slate-100">-</button>
                                            <span className="w-6 text-center font-bold text-slate-800">{workers[key]}명</span>
                                            <button onClick={() => updateWorker(key, 1)} className="w-8 h-8 rounded-lg bg-blue-600 text-white font-bold flex items-center justify-center active:bg-blue-700">+</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Section 2: 주요 작업 내용 */}
                        <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                            <h2 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                                <span className="w-5 h-5 rounded-full bg-blue-100 text-blue-600 inline-flex items-center justify-center text-xs">2</span>
                                오늘의 주요 작업 내용
                            </h2>
                            <div className="grid grid-cols-2 gap-2">
                                {[
                                    { key: 'livingRoomWood', label: '거실 목공틀 시공' },
                                    { key: 'bedroomElectric', label: '안방 전기 배선' },
                                    { key: 'balconyTile', label: '발코니 타일 작업' },
                                    { key: 'verandaPaint', label: '베란다 도장 작업' }
                                ].map(task => (
                                    <button
                                        key={task.key}
                                        onClick={() => toggleTask(task.key)}
                                        className={`p-3 rounded-xl text-xs font-medium text-left transition-all border ${
                                            selectedTasks[task.key]
                                                ? 'bg-blue-50 border-blue-300 text-blue-700 shadow-sm'
                                                : 'bg-slate-50 border-slate-200 text-slate-600'
                                        }`}
                                    >
                                        {selectedTasks[task.key] ? '☑ ' : '☐ '} {task.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Section 3: 현장 사진 */}
                        <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                            <h2 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                                <span className="w-5 h-5 rounded-full bg-blue-100 text-blue-600 inline-flex items-center justify-center text-xs">3</span>
                                현장 사진 기록
                            </h2>
                            <div className="flex gap-2">
                                <div className="w-20 h-20 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 bg-slate-50 cursor-pointer hover:bg-slate-100">
                                    <span className="text-xl">📷</span>
                                    <span className="text-[10px] mt-1">목공완료</span>
                                </div>
                                <div className="w-20 h-20 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 bg-slate-50 cursor-pointer hover:bg-slate-100">
                                    <span className="text-xl">📷</span>
                                    <span className="text-[10px] mt-1">자재입고</span>
                                </div>
                                <div className="w-20 h-20 rounded-xl border-2 border-dashed border-blue-300 flex flex-col items-center justify-center text-blue-500 bg-blue-50 cursor-pointer">
                                    <span className="text-xl">➕</span>
                                    <span className="text-[10px] mt-1 font-medium">사진추가</span>
                                </div>
                            </div>
                        </div>

                        {/* Section 4: 음성 특이사항 메모 */}
                        <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                            <h2 className="text-sm font-bold text-slate-800 mb-2 flex items-center gap-1.5">
                                🎤 특이사항 메모
                            </h2>
                            <textarea
                                value={memo}
                                onChange={(e) => setMemo(e.target.value)}
                                className="w-full p-3 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-700 focus:outline-none focus:border-blue-500 h-20 resize-none"
                                placeholder="특이사항을 입력하거나 음성 인식을 사용하세요."
                            />
                            <button onClick={() => alert("마이크 권한을 요청합니다 (음성 인식 시뮬레이션)")} className="mt-2 w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium flex items-center justify-center gap-1.5 transition-colors">
                                🎙️ 터치해서 말하기 (STT 음성 변환)
                            </button>
                        </div>
                    </div>

                    {/* Footer Actions */}
                    <div className="px-4 space-y-2 mt-4">
                        <button
                            onClick={handleLoadYesterday}
                            className="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-semibold transition-colors"
                        >
                            📋 전일 데이터 불러오기
                        </button>
                        <button
                            onClick={handleSubmit}
                            className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-md shadow-blue-500/30 transition-all active:scale-[0.99]"
                        >
                            🚀 일보 제출하기
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
